  <title>自习室开放安排-湖南理工大学教务处</title>
</head>
<body>
<nav><a href="/">首页</a></nav>
<section>
  <div class="edu-main-content">
    <p>自习室于每周一至周五 7:00-22:00 开放，周末 8:00-21:00 开放。考试周期间延长至 23:00。</p>
    <p>进入自习室须出示校园卡，保持安静，不得占用座位过夜。违者清退并通报所在学院。</p>
    <p>各教学楼自习室分布：第一教学楼 101-108、第二教学楼 201-206、图书馆三楼西侧阅览区。</p>
    <p>期末复习高峰期（第十六周起）增开第三教学楼 301-305 作为临时自习区，具体以教务处通知为准。</p>
    <p>自习室开放期间由学生自律委员会协助管理，每日 21:30 开始清点人数并登记占座情况。</p>
  </div>
</section>
<footer>地址：湖南省岳阳市湘北大道</footer>
