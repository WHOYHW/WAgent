# NOTE: keep this file ASCII-only - configparser reads it with the system
# locale encoding (GBK on zh-CN Windows), which breaks on UTF-8 comments.
# Alembic config (C3: AC3.1/AC3.2 migrations executable & rollback-able)
# Usage (in backend/):
#   alembic upgrade head      # create tables
#   alembic downgrade -1      # rollback one revision
#   alembic revision -m "..." # generate a new migration
[alembic]
script_location = migrations
# The connection URL is taken from app.config.settings.db_url_sync via
# migrations/env.py; this value is a placeholder only (override in prod
# with the DB_URL_SYNC environment variable).
sqlalchemy.url = sqlite:///./campus_agent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
